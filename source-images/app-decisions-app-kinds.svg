<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B0B33"/><stop offset="1" stop-color="#0B0A14"/></linearGradient>
<radialGradient id="glow" cx="0.85" cy="0.1" r="0.6"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.4"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#glow)"/>
<text x="60" y="78" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="24" letter-spacing="3" fill="#C4B5FD">DECISION APPS</text>
<text x="60" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="52" fill="#FFFFFF">Four kinds of "decision apps"</text>
<rect x="60" y="175" width="540" height="200" rx="20" fill="#4ADE80" fill-opacity="0.14" stroke="#4ADE80" stroke-opacity="0.7" stroke-width="2"/><text x="88" y="237" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="32" fill="#FFFFFF">Random deciders</text><text x="88" y="287" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="500" font-size="27" fill="#CBD5E1">Yes/no button, coin, wheel, dice.</text><text x="88" y="323" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="500" font-size="27" fill="#CBD5E1">Answer by chance. Great tie-break.</text><rect x="620" y="175" width="520" height="200" rx="20" fill="#60A5FA" fill-opacity="0.14" stroke="#60A5FA" stroke-opacity="0.7" stroke-width="2"/><text x="648" y="237" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="32" fill="#FFFFFF">Comparison tools</text><text x="648" y="287" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="500" font-size="27" fill="#CBD5E1">Pros and cons, weighted scores.</text><text x="648" y="323" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="500" font-size="27" fill="#CBD5E1">You score your own options.</text><rect x="60" y="395" width="540" height="200" rx="20" fill="#A78BFA" fill-opacity="0.14" stroke="#A78BFA" stroke-opacity="0.7" stroke-width="2"/><text x="88" y="457" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="32" fill="#FFFFFF">AI advisors</text><text x="88" y="507" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="500" font-size="27" fill="#CBD5E1">Chat-style suggestions.</text><text x="88" y="543" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="500" font-size="27" fill="#CBD5E1">Sounds sure, may lack the facts.</text><rect x="620" y="395" width="520" height="200" rx="20" fill="#F87171" fill-opacity="0.14" stroke="#F87171" stroke-opacity="0.7" stroke-width="2"/><text x="648" y="457" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="32" fill="#FFFFFF">Money-on-the-line apps</text><text x="648" y="507" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="500" font-size="27" fill="#CBD5E1">Betting and prediction products.</text><text x="648" y="543" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="500" font-size="27" fill="#CBD5E1">Not decision tools. Avoid.</text><text x="60" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="24" fill="#64748B">yesnobuttonapp.com</text></svg>