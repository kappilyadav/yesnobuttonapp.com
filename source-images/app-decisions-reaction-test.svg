<text x="60" y="78" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="24" letter-spacing="3" fill="#C4B5FD">THE REACTION TEST</text>
<text x="60" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="52" fill="#FFFFFF">Six steps. Ten seconds.</text>
<rect x="60" y="175" width="340" height="200" rx="20" fill="#4ADE80" fill-opacity="0.14" stroke="#4ADE80" stroke-opacity="0.7" stroke-width="2"/><circle cx="110" cy="227" r="26" fill="#4ADE80"/><text x="110" y="237" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="30" fill="#0B0A14">1</text><text x="152" y="237" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="30" fill="#FFFFFF">Phrase it</text><text x="88" y="287" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="500" font-size="25" fill="#CBD5E1">"Yes" should mean doing</text><text x="88" y="323" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="500" font-size="25" fill="#CBD5E1">the thing.</text><rect x="430" y="175" width="340" height="200" rx="20" fill="#60A5FA" fill-opacity="0.14" stroke="#60A5FA" stroke-opacity="0.7" stroke-width="2"/><circle cx="480" cy="227" r="26" fill="#60A5FA"/><text x="480" y="237" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="30" fill="#0B0A14">2</text><text x="522" y="237" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="30" fill="#FFFFFF">Say your hope</text><text x="458" y="287" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="500" font-size="25" fill="#CBD5E1">Out loud, before you</text><text x="458" y="323" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="500" font-size="25" fill="#CBD5E1">press.</text><rect x="800" y="175" width="340" height="200" rx="20" fill="#A78BFA" fill-opacity="0.14" stroke="#A78BFA" stroke-opacity="0.7" stroke-width="2"/><circle cx="850" cy="227" r="26" fill="#A78BFA"/><text x="850" y="237" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="30" fill="#0B0A14">3</text><text x="892" y="237" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="30" fill="#FFFFFF">Press once</text><text x="828" y="287" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="500" font-size="25" fill="#CBD5E1">One question, one press.</text><rect x="60" y="395" width="340" height="200" rx="20" fill="#FBBF24" fill-opacity="0.14" stroke="#FBBF24" stroke-opacity="0.7" stroke-width="2"/><circle cx="110" cy="447" r="26" fill="#FBBF24"/><text x="110" y="457" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="30" fill="#0B0A14">4</text><text x="152" y="457" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="30" fill="#FFFFFF">Notice</text><text x="88" y="507" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="500" font-size="25" fill="#CBD5E1">Relief or disappointment?</text><rect x="430" y="395" width="340" height="200" rx="20" fill="#4ADE80" fill-opacity="0.14" stroke="#4ADE80" stroke-opacity="0.7" stroke-width="2"/><circle cx="480" cy="447" r="26" fill="#4ADE80"/><text x="480" y="457" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="30" fill="#0B0A14">5</text><text x="522" y="457" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="30" fill="#FFFFFF">Act on it</text><text x="458" y="507" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="500" font-size="25" fill="#CBD5E1">Follow what you learned.</text><rect x="800" y="395" width="340" height="200" rx="20" fill="#F87171" fill-opacity="0.14" stroke="#F87171" stroke-opacity="0.7" stroke-width="2"/><circle cx="850" cy="447" r="26" fill="#F87171"/><text x="850" y="457" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="30" fill="#0B0A14">6</text><text x="892" y="457" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="30" fill="#FFFFFF">Never twice</text><text x="828" y="507" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="500" font-size="25" fill="#CBD5E1">A re-press hunts for the</text><text x="828" y="543" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="500" font-size="25" fill="#CBD5E1">answer you want.</text><text x="60" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="24" fill="#64748B">yesnobuttonapp.com</text></svg>