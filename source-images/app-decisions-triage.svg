<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B0B33"/><stop offset="1" stop-color="#0B0A14"/></linearGradient>
<radialGradient id="glow" cx="0.85" cy="0.1" r="0.6"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.4"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#glow)"/>
<text x="60" y="78" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="24" letter-spacing="3" fill="#C4B5FD">THREE-QUESTION TEST</text>
<text x="60" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="52" fill="#FFFFFF">Which decisions go to an app?</text>
<text x="60" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="600" font-size="28" fill="#CBD5E1">Undo cheaply?   ·   Fine either way?   ·   Overthinking costs more?</text><rect x="60" y="225" width="1080" height="112" rx="20" fill="#4ADE80" fill-opacity="0.14" stroke="#4ADE80" stroke-opacity="0.7" stroke-width="2"/><circle cx="118" cy="281" r="26" fill="#4ADE80"/><text x="170" y="273" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="34" fill="#FFFFFF">Yes to all three: Press the button and move on.</text><text x="170" y="313" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="500" font-size="27" fill="#CBD5E1">Dinner, a movie, who goes first</text><rect x="60" y="355" width="1080" height="112" rx="20" fill="#FBBF24" fill-opacity="0.14" stroke="#FBBF24" stroke-opacity="0.7" stroke-width="2"/><circle cx="118" cy="411" r="26" fill="#FBBF24"/><text x="170" y="403" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="34" fill="#FFFFFF">Two yes, one "maybe": Tie-break or reaction test only.</text><text x="170" y="443" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="500" font-size="27" fill="#CBD5E1">Gifts, trips, a close purchase</text><rect x="60" y="485" width="1080" height="112" rx="20" fill="#F87171" fill-opacity="0.14" stroke="#F87171" stroke-opacity="0.7" stroke-width="2"/><circle cx="118" cy="541" r="26" fill="#F87171"/><text x="170" y="533" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="34" fill="#FFFFFF">A "no" to question 1 or 2: Keep the app out of it.</text><text x="170" y="573" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="500" font-size="27" fill="#CBD5E1">Use the 10-10-10 rule, talk to people</text><text x="60" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="24" fill="#64748B">yesnobuttonapp.com</text></svg>